  /* ---------- logic (pure) ---------- */
  function evaluate(a){
    const has = (k,v) => Array.isArray(a[k]) && a[k].includes(v);
    const wait=[], cornea=[], alt=[], detail=[], ok=[], notes=[];
    if (a.age==="u18") wait.push("u18");
    if (a.stable==="changed") wait.push("changed");
    if (has("health","preg")) wait.push("preg");
    if (has("health","iso")) wait.push("iso");
    if (has("health","dmu")) wait.push("dmu");

    if (a.kc==="self") cornea.push("kcSelf");
    else if (a.kc==="family" && (a.rub==="often" || a.stable==="changed" || a.cyl==="gt3")) cornea.push("kcRisk");

    const plus = a.type==="plus";
    if (!plus && a.sph==="11") alt.push("hiMyo");
    if (plus && (a.sph==="8" || a.sph==="10" || a.sph==="11")) alt.push("hiPlus");
    if (a.pachy==="lt480") alt.push("thin");

    if (!plus && a.sph==="10") detail.push("myo810");
    if (plus && a.sph==="6") detail.push("plusMid");
    if (a.cyl==="gt3") detail.push("cyl");
    if (a.pachy==="480") detail.push("borderPachy");
    if (a.dry==="often") detail.push("dry");
    if (a.rub==="often") detail.push("rub");
    if (a.kc==="family" && !cornea.length) detail.push("kcFam");
    if (a.kc==="dk") detail.push("kcDk");
    if (a.age==="40" || a.age==="46") detail.push("age40");
    if (a.age==="18") detail.push("age18");
    if (a.cl==="daily" || a.cl==="rgp") detail.push("cl");
    if (has("health","dmc") && !has("health","dmu")) detail.push("dmc");
    if (has("health","auto")) detail.push("auto");
    ["surgery","glaucoma","retina","lazy"].forEach(k => { if (has("eye",k)) detail.push(k); });
    if (a.purpose==="job") detail.push("job");
    if (a.purpose==="sport") detail.push("sport");
    if (a.stable==="dk") detail.push("stableDk");

    if (a.age==="21") ok.push("age");
    if (a.sph!=="dk" && a.type!=="dk" && !alt.includes("hiMyo") && !alt.includes("hiPlus") && !detail.includes("myo810") && !detail.includes("plusMid")) ok.push("power");
    if (a.stable==="stable") ok.push("stable");
    if (a.pachy==="gt500") ok.push("pachy");
    if (has("health","none")) ok.push("health");
    if (has("eye","none")) ok.push("eye");

    if (a.pachy==="dk") notes.push("pachyDk");
    if (a.sph==="dk" || a.type==="dk" || a.cyl==="dk") notes.push("powerDk");
    if (a.cl==="occ") notes.push("clOcc");
    notes.push("machine");

    const cat = a.urgent==="yes" ? "urgent" : cornea.length ? "cornea" : wait.length ? "wait" : alt.length ? "alt" : detail.length ? "detail" : "good";
    return { cat, reasons:[...cornea, ...wait, ...alt, ...detail], ok, notes };
  }

  /* ---------- state + rendering ---------- */
  let lang = "en", idx = -1, ans = {}, contact = null, refId = "";
  const app = document.getElementById("app");
  const L = pair => pair[lang === "hi" ? 1 : 0];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const track = (name, params) => { if (window.gtag) gtag("event", name, params || {}); };

  function render(){
    if (idx < 0) return renderIntro();
    if (idx < Q.length) return renderQ();
    if (idx === Q.length && LEAD_WEBHOOK && !contact) return renderContact();
    renderResult();
  }

  function renderIntro(){
    app.innerHTML =
      '<span class="eyebrow">' + L(T.eyebrow) + '</span><h1>' + L(T.title) + '</h1>' +
      '<p class="muted" style="margin-top:12px">' + L(T.intro) + '</p>' +
      '<div class="doc"><div class="av">PT</div><div><b>Dr. Prateek Tiwari</b><span>' + L(T.docRole) + '</span></div></div>' +
      '<ul class="pts"><li>' + L(T.p1) + '</li><li>' + L(T.p2) + '</li><li>' + L(T.p3) + '</li></ul>' +
      '<div class="stack"><button class="btn btn-primary" id="go">' + L(T.start) + '</button></div>' +
      '<p class="disc">' + L(T.introDisc) + '</p>';
    document.getElementById("go").onclick = () => { idx = 0; track("selfcheck_start"); render(); scrollTop(); };
  }

  function renderQ(){
    const q = Q[idx], cur = ans[q.id];
    let h = '<div class="bar"><i style="width:' + Math.round(idx / Q.length * 100) + '%"></i></div>' +
      '<div class="step"><span>' + L(T.qOf) + ' ' + (idx + 1) + ' / ' + Q.length + '</span>' +
      (idx > 0 ? '<button class="btn btn-ghost" id="back">' + L(T.back) + '</button>' : '<span></span>') + '</div>' +
      '<h2>' + L(q.t) + '</h2>' +
      (q.h ? '<p class="hint">' + L(q.h) + '</p>' : '') +
      (q.multi ? '<p class="hint">' + L(T.pickAll) + '</p>' : '') + '<div class="opts">';
    q.o.forEach(o => {
      const sel = q.multi ? (cur || []).includes(o[0]) : cur === o[0];
      h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-v="' + o[0] + '">' +
        (q.multi ? '<span class="box">' + (sel ? '✓' : '') + '</span>' : '') + '<span>' + L(o[1]) + '</span></button>';
    });
    h += '</div>';
    if (q.multi) h += '<div class="stack"><button class="btn btn-primary" id="nx"' + ((cur || []).length ? '' : ' disabled') + '>' + L(T.next) + '</button></div>';
    app.innerHTML = h;
    const back = document.getElementById("back");
    if (back) back.onclick = () => { idx--; render(); };
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (!q.multi) {
        ans[q.id] = v;
        if (q.id === "urgent" && v === "yes") { idx = Q.length + 1; render(); scrollTop(); return; }
        idx++; render(); scrollTop(); return;
      }
      let arr = (ans[q.id] || []).slice();
      if (v === "none") arr = arr.includes("none") ? [] : ["none"];
      else { arr = arr.filter(x => x !== "none"); arr = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v); }
      ans[q.id] = arr; render();
    });
    const nx = document.getElementById("nx");
    if (nx) nx.onclick = () => { idx++; render(); scrollTop(); };
  }

  function renderContact(){
    app.innerHTML =
      '<div class="bar"><i style="width:100%"></i></div>' +
      '<h2>' + L(T.cTitle) + '</h2><p class="hint">' + L(T.cHint) + '</p>' +
      '<label class="field">' + L(T.cName) + '<input id="cn" autocomplete="name" maxlength="60"></label>' +
      '<label class="field">' + L(T.cWa) + '<input id="cw" type="tel" inputmode="numeric" autocomplete="tel" maxlength="15" placeholder="98XXXXXXXX"></label>' +
      '<p class="hint small">' + L(T.cConsent) + ' <a href="/policies.html#privacy" target="_blank" rel="noopener">Privacy</a></p>' +
      '<div class="stack"><button class="btn btn-primary" id="cs">' + L(T.cShow) + '</button>' +
      '<button class="btn btn-ghost" id="ck" style="justify-self:center">' + L(T.cSkip) + '</button></div>';
    document.getElementById("cs").onclick = () => {
      contact = { name: document.getElementById("cn").value.trim(), wa: document.getElementById("cw").value.replace(/\D/g, "") };
      idx = Q.length + 1; render(); scrollTop();
    };
    document.getElementById("ck").onclick = () => { contact = { name:"", wa:"" }; idx = Q.length + 1; render(); scrollTop(); };
  }

  function listHtml(keys, cls, map, withTitle){
    if (!keys.length) return "";
    return '<ul class="rs ' + cls + '">' + keys.map(k => withTitle
      ? '<li><b>' + L(map[k][0]) + '</b><span>' + L(map[k][1]) + '</span></li>'
      : '<li><span>' + L(map[k]) + '</span></li>').join("") + '</ul>';
  }

  function nextStepHtml(res){
    const tests = '<ol>' + L(T.tests).split("|").map(t => '<li>' + t + '</li>').join("") + '</ol>';
    const hasScan = ans.reports === "topo";
    const en = lang !== "hi";
    let body = "", cta = true;
    if (res.cat === "wait") {
      cta = false;
      body = '<p>' + (en ? "Wait until the points above have settled, then take this self-check again. There is no benefit in rushing, and nothing is lost by waiting. Keep wearing your glasses or lenses meanwhile."
                         : "ऊपर लिखी बातें ठीक होने तक इंतज़ार करें, फिर यह self-check दोबारा करें। जल्दबाज़ी का कोई फ़ायदा नहीं, और इंतज़ार से कुछ नुक़सान नहीं। तब तक चश्मा या lens पहनते रहें।") + '</p>';
    } else if (res.cat === "cornea") {
      body = '<p>' + (hasScan
        ? (en ? "You already have corneal scans. Have them read by a cornea specialist before you agree to any procedure."
              : "आपके पास corneal scans पहले से हैं। किसी भी procedure के लिए हाँ कहने से पहले इन्हें cornea specialist से पढ़वाएँ।")
        : (en ? "Get a corneal topography / tomography scan of both eyes, then have it read by a cornea specialist. Please stop rubbing your eyes."
              : "दोनों आँखों का corneal topography / tomography scan करवाएँ, फिर उसे cornea specialist से पढ़वाएँ। आँखें मलना बंद कर दें।")) + '</p>';
    } else if (hasScan) {
      body = '<p>' + (en ? "You already have corneal scans, so you are one step away from a clear answer. A cornea specialist can read them and tell you which procedure fits your eyes, or whether the plan you were given is right."
                         : "आपके पास corneal scans हैं, यानी साफ़ जवाब से आप बस एक कदम दूर हैं। Cornea specialist इन्हें पढ़कर बता सकते हैं कि कौन सी procedure आपकी आँखों के लिए सही है, या आपको दिया गया plan ठीक है या नहीं।") + '</p>';
    } else {
      body = '<p>' + (en ? "You need a proper eye work-up before anyone can answer this for sure. Ask any good eye centre for these tests, and ask for copies of every report (they are yours):"
                         : "पक्के जवाब के लिए पहले आँखों की पूरी जाँच ज़रूरी है। किसी भी अच्छे eye centre से ये tests करवाएँ, और हर report की copy माँगें (ये आपकी हैं):") + '</p>' + tests +
             '<p style="margin-top:10px">' + (en ? "Once you have the reports, you can have them independently reviewed before you decide."
                                                : "Reports मिलने के बाद, फ़ैसला लेने से पहले आप उन्हें independent तौर पर review करवा सकते हैं।") + '</p>';
    }
    let h = '<div class="next"><h3>' + L(T.nextHead) + '</h3>' + body + '</div>';
    if (cta) h += '<div class="stack noprint"><a class="btn btn-primary" id="cta" href="' + FORM_URL + '">' + L(T.cta) + '</a>' +
      '<p class="small muted" style="text-align:center">' + L(T.ctaSub) + ' <a href="/?lang=' + lang + '">' + L(T.learn) + '</a></p></div>';
    return h;
  }

  function renderResult(){
    const res = evaluate(ans);
    if (!refId) {
      const d = new Date();
      refId = "SC-" + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
      track("selfcheck_complete", { result: res.cat });
      if (window.fbq) fbq("trackCustom", "SelfCheckComplete", { result: res.cat });
      sendLead(res);
    }
    if (res.cat === "urgent") {
      app.innerHTML = '<div class="urgent"><h2>' + (lang === "hi" ? "कृपया आज ही आँखों के doctor को दिखाएँ" : "Please see an eye doctor today") + '</h2><p style="margin-top:10px">' +
        (lang === "hi" ? "अचानक नज़र कम होना, दर्द, चमक या नए floaters emergency के लक्षण हो सकते हैं। यह self-check इसके लिए नहीं है। नज़दीकी eye hospital जाएँ। LASIK के बारे में बाद में सोचा जा सकता है।"
                       : "Sudden vision loss, pain, flashes or new floaters can be signs of an emergency. This self-check is not meant for that. Go to the nearest eye hospital. LASIK can be thought about later.") +
        '</p></div><div class="stack"><button class="btn btn-outline" id="again">' + L(T.again) + '</button></div>';
      document.getElementById("again").onclick = restart; return;
    }
    const c = CAT[res.cat];
    const date = new Date().toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", { day:"numeric", month:"long", year:"numeric" });
    app.innerHTML =
      '<div style="--c:' + c.c + '">' +
      '<div class="rep-head"><div><b>' + L(T.repTitle) + '</b>' + L(T.repBy) + '</div><div>' + date + '<br>' + L(T.ref) + ': ' + refId +
        (contact && contact.name ? '<br>' + esc(contact.name) : '') + '</div></div>' +
      '<div class="verdict"><span class="stamp">' + L(c.stamp) + '</span><h2>' + L(c.h) + '</h2><p>' + L(c.s) + '</p></div>' +
      (res.reasons.length ? '<h3>' + L(T.why) + '</h3>' + listHtml(res.reasons, "", R, true) : '') +
      (res.ok.length ? '<h3>' + L(T.okHead) + '</h3>' + listHtml(res.ok, "ok", OK, false) : '') +
      '<h3>' + L(T.noteHead) + '</h3>' + listHtml(res.notes, "nt", NOTE, false) +
      nextStepHtml(res) +
      '<div class="stack noprint"><button class="btn btn-outline" id="save">' + L(T.save) + '</button>' +
      '<button class="btn btn-ghost" id="again" style="justify-self:center">' + L(T.again) + '</button></div>' +
      '<p class="disc">' + L(T.disc) + '</p></div>';
    document.getElementById("save").onclick = () => window.print();
    document.getElementById("again").onclick = restart;
    const cta = document.getElementById("cta");
    if (cta) cta.onclick = () => { track("generate_lead", { method:"selfcheck_" + res.cat }); if (window.fbq) fbq("track", "Lead"); };
  }

  function sendLead(res){
    if (!LEAD_WEBHOOK || !contact || !contact.wa) return;
    try {
      fetch(LEAD_WEBHOOK, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify({ ref:refId, name:contact.name, whatsapp:contact.wa, result:res.cat, reasons:res.reasons, answers:ans, lang, at:new Date().toISOString() }) });
    } catch(e) {}
  }

  function restart(){ idx = -1; ans = {}; contact = null; refId = ""; render(); scrollTop(); }
  function scrollTop(){ window.scrollTo(0, 0); }

  function setLang(l){
    lang = l === "hi" ? "hi" : "en";
    document.body.className = lang; document.documentElement.lang = lang;
    document.querySelectorAll("[data-set-lang]").forEach(b => b.classList.toggle("active", b.dataset.setLang === lang));
    document.querySelectorAll(".js-home").forEach(a => a.href = "/?lang=" + lang);
    try { localStorage.setItem("so_lang", lang); } catch(e) {}
    const url = new URL(location.href); url.searchParams.set("lang", lang); history.replaceState(null, "", url);
    render();
  }
  document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.setLang)));
  let initial = new URLSearchParams(location.search).get("lang");
  if (!initial) { try { initial = localStorage.getItem("so_lang"); } catch(e) {} }
  setLang(initial || "en");
</script>
</body>
</html>
