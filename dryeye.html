html,body{margin:0;padding:0}
body{font-family:Inter,'Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}

.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;padding:6px 12px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 1px 2px rgba(16,40,63,.04),0 8px 24px rgba(16,40,63,.05)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 6px}
.progress i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s ease}
.step{font-size:14px;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between}
h1{font-size:30px;line-height:1.15;margin:4px 0 10px;font-weight:700;letter-spacing:-.3px}
h2{font-size:23px;line-height:1.25;margin:0 0 6px;font-weight:700}
h3{font-size:18px;margin:22px 0 8px;font-weight:700}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:18px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--teal);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.chip{background:var(--teal-l);color:var(--teal-d);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600}
.hint{font-size:15px;color:var(--muted);margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:18px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:#93b4f5}
.opt:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
.opt.sel{border-color:var(--teal);background:var(--teal-l)}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #b8c7cf;display:grid;place-items:center}
.opt.sel .dot{border-color:var(--teal);background:var(--teal)}
.opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #b8c7cf;display:grid;place-items:center}
.opt.sel .box{border-color:var(--teal);background:var(--teal)}
.opt.sel .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt.na{color:var(--muted);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:18px;border:0;border-radius:14px;padding:14px 22px;cursor:pointer;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(.95)}
.btn-primary{background:var(--teal);color:#fff;width:100%}
.btn-wa{background:var(--wa);color:#fff;width:100%}
.btn-ghost{background:transparent;color:var(--teal);padding:10px 6px}
.btn-line{background:#fff;color:var(--teal-d);border:1.5px solid var(--line);width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.rf{list-style:none;margin:14px 0 18px;padding:0;display:grid;gap:8px}
.rf li{display:flex;gap:10px;align-items:flex-start;background:var(--red-l);border-radius:12px;padding:10px 12px;font-size:17px}
.rf li::before{content:"!";flex:none;width:22px;height:22px;border-radius:50%;background:var(--b4);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin-top:2px}
.stack{display:grid;gap:10px}
.urgent{border-color:#efc3bf}
.urgent .eyebrow{color:var(--b4)}
.gauge{margin:16px 0 6px}
.gbar{position:relative;height:14px;border-radius:8px;display:grid;grid-template-columns:13fr 10fr 10fr 67fr;overflow:visible}
.gbar span:nth-child(1){background:var(--b1);border-radius:8px 0 0 8px}
.gbar span:nth-child(2){background:var(--b2)}
.gbar span:nth-child(3){background:var(--b3)}
.gbar span:nth-child(4){background:var(--b4);border-radius:0 8px 8px 0}
.marker{position:absolute;top:-7px;width:4px;height:28px;background:var(--ink);border-radius:2px;transform:translateX(-2px);box-shadow:0 0 0 3px #fff}
.glabels{position:relative;height:18px;font-size:13px;color:var(--muted);margin-top:8px}.glabels span{position:absolute;transform:translateX(-50%)}.glabels span:first-child{transform:none}.glabels span:last-child{transform:translateX(-100%)}
.score{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.score b{font-size:54px;line-height:1;font-weight:700;letter-spacing:-1px}
.score small{color:var(--muted);font-size:17px}
.band{display:inline-block;color:#fff;font-weight:700;border-radius:999px;padding:3px 14px;font-size:16px;margin:4px 0 12px}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{position:relative;padding-left:22px;font-size:17px}
.list li::before{content:"";position:absolute;left:4px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.risk li b{font-weight:600}
.risk li span{color:var(--muted)}
.cta{background:var(--teal-l);border-radius:16px;padding:18px;margin:22px 0 4px}
.cta h3{margin-top:0}
.small{font-size:14px;color:var(--muted)}
.phone{font-weight:700;color:var(--ink);letter-spacing:.3px}
footer a{color:var(--muted)}
footer{margin-top:22px;font-size:13.5px;color:var(--muted);line-height:1.5}
footer p{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:420px){h1{font-size:27px}h2{font-size:21px}.card{padding:20px 16px}.opt{font-size:17px;padding:12px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    meds:['एलर्जी, BP, डिप्रेशन/एंग्ज़ायटी या मुंहासों की नियमित दवा','कई आम दवाइयाँ आँसू कम करती हैं।'],
    drops:['लंबे समय से कोई आई ड्रॉप (जैसे ग्लूकोमा/काला मोतिया के लिए)','लंबे समय की ड्रॉप्स के प्रिज़र्वेटिव आँख की सतह को परेशान कर सकते हैं।'],
    lids:['पलकों पर रूसी, बार-बार गुहेरी, या पलकों के किनारे सूजे रहना','यह पलकों की तेल ग्रंथियों की ओर इशारा है — ड्राई आई का सबसे आम कारण।'],
    ac:['लंबे समय AC या धूल वाली जगह में रहना','सूखी, चलती हवा आँसुओं को जल्दी सुखा देती है।'],
    smoke:['धूम्रपान','धुआँ आँखों को परेशान करता है और आँसुओं की परत बिगाड़ता है।']
  },
  riskNone:'इनमें से कोई नहीं', seeResult:'मेरा रिज़ल्ट देखें',
  resEyebrow:'आपका रिज़ल्ट', scoreOf:'100 में से', scoreLabel:'लक्षण स्कोर',
  bands:{
    minimal:['सामान्य सीमा','आपके जवाबों के अनुसार अभी ड्राई आई की तकलीफ़ बहुत कम या नहीं है। अगर कोई रिस्क फ़ैक्टर लागू होता है, तो साल में एक बार आँखों की जाँच फिर भी करवाएँ।'],
    mild:['हल्के लक्षण','आपके लक्षण हल्की ड्राई आई जैसे हैं। रोज़ की कुछ आदतें अक्सर मदद करती हैं, लेकिन बढ़ने से पहले एक छोटी जाँच से कारण पक्का हो सकता है।'],
    moderate:['मध्यम','आपके लक्षण साफ़ हैं और रोज़ के कामों पर असर डालने लगे हैं। इस स्तर पर ड्राई आई का अक्सर कोई ख़ास कारण होता है — पलकों की तेल ग्रंथियाँ, आँसुओं की कमी या पलकों की सूजन — जो जाँच से पता चलता है। सिर्फ़ ड्रॉप्स अक्सर काफ़ी नहीं होतीं।'],
    severe:['गंभीर','आपके लक्षण काफ़ी ज़्यादा हैं। जल्द ही विस्तृत ड्राई आई जाँच करवाने की सलाह है। इलाज न हो, तो गंभीर ड्राई आई आँख की सतह और नज़र की गुणवत्ता पर असर डाल सकती है।']
  },
  gl:['सामान्य','हल्के','मध्यम','गंभीर'],
  riskHead:'क्या वजह हो सकती है',
  clinicHead:'Eye specialist ड्राई आई के लिए क्या जाँचते हैं',
  clinic:['आँसुओं की परत कितनी जल्दी टूटती है','आँखें कितने आँसू बनाती हैं (शिर्मर टेस्ट)','पलकों की तेल ग्रंथियाँ और किनारे','ख़ास डाई से कॉर्निया की सतह','कारण के हिसाब से इलाज की योजना, सिर्फ़ लक्षणों के लिए नहीं'],
  tipsHead:'तब तक ये आदतें मदद करेंगी',
  tips:['20-20-20 नियम: हर 20 मिनट स्क्रीन के बाद, 20 फ़ीट दूर 20 सेकंड देखें।','पढ़ते या स्क्रीन देखते समय जान-बूझकर पूरी पलक झपकाएँ।','AC और पंखे की हवा सीधे चेहरे पर न आने दें।','डॉक्टर की सलाह के बिना स्टेरॉइड या "लालिमा हटाने वाली" ड्रॉप्स न डालें।'],
  ctaHead:'LASIK, SMILE, PRK या ICL का सोच रहे हैं?', ctaText:'किसी भी laser surgery से पहले dry eye ज़रूर जँचवाएँ। LASIK से कुछ महीनों के लिए dry eye बढ़ सकती है, और बिना इलाज की dry eye से measurements ग़लत आ सकते हैं और procedure का चुनाव बदल सकता है।',
  ctaCheck:'मुफ़्त LASIK eligibility check · 3 मिनट →', ctaReview:'Reports हैं? ₹1,000 second opinion शुरू करें', ctaOther:'Surgery का प्लान नहीं है? यह result अपने नज़दीकी किसी भी eye specialist को दिखाकर dry eye की पूरी जाँच करवाएँ।',
  copy:'रिज़ल्ट कॉपी करें', copied:'रिज़ल्ट कॉपी हो गया', retake:'चेक दोबारा करें',
  copyText:function(s,b){return 'Dry Eye Self-Check result\nलक्षण स्कोर: '+s+'/100 ('+b+')\nsecondopinion.drprateektiwari.net/dryeye.html';},
  foot:['यह ड्राई आई के आम लक्षणों पर आधारित, 0–100 स्केल पर स्कोर होने वाला जानकारी-भर का self-check है। यह diagnosis नहीं है और आँखों की जाँच की जगह नहीं ले सकता।','आपके जवाब सिर्फ़ आपके फ़ोन पर रहते हैं। कुछ भी collect या भेजा नहीं जाता।','Dr. Prateek Tiwari · MBBS, MS (Ophthalmology) · Fellowship in Cornea & Anterior Segment · MP Medical Council Reg. No. 13522']
}};

var RISK_KEYS = ['screen','cl','surgery','lids','ac','meds','drops','hormonal','diabetes','thyroid','autoimmune','smoke'];

// Steps
var STEPS = [{t:'intro'},{t:'rf'}];
for (var i=0;i<5;i++) STEPS.push({t:'q',g:'sym',i:i});
for (var j=0;j<4;j++) STEPS.push({t:'q',g:'imp',i:j});
for (var m=0;m<3;m++) STEPS.push({t:'q',g:'env',i:m});
STEPS.push({t:'risk'},{t:'result'});
var Q_TOTAL = 12 + 3; // rf + 12 q + age + risk => progress units after intro
var lang = 'en';
var qp = new URLSearchParams(location.search).get('lang'); var saved=null; try { saved = localStorage.getItem('so_lang'); } catch(e){}
var pick = qp || saved; if (pick==='hi'||pick==='en') lang = pick;
var state = {step:0, ans:{}, age:null, risks:{}, urgent:false, rfSeen:false};

var app = document.getElementById('app');
function L(){ return T[lang]; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function setLang(l){
  lang = l;
  try { localStorage.setItem('so_lang', l); } catch(e){}
  try { var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(null,'',u); } catch(e){}
  document.querySelectorAll('.js-home').forEach(function(a){ a.href='/?lang='+l; });
  document.documentElement.lang = l==='hi'?'hi':'en';
  document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===l?'true':'false'); });
  render();
}
document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.lang); }); });

function progressHTML(){
  var idx = state.step; // 1..15 for rf..risk
  var total = STEPS.length - 2; // excluding intro & result
  var pct = Math.round((idx-1)/total*100);
  return '<div class="progress" aria-hidden="true"><i style="width:'+Math.max(4,pct)+'%"></i></div>'+
         '<div class="step"><span>'+idx+' '+L().of+' '+total+'</span><span></span></div>';
}

function computeScore(){
  var sum=0,n=0;
  for (var k in state.ans){ var v=state.ans[k]; if (v!==null && v!==undefined){ sum+=v; n++; } }
  if (!n) return 0;
  return Math.round(sum*25/n); // OSDI method: (sum of scores × 25) / questions answered
}
function bandOf(s){ return s<13?'minimal': s<23?'mild': s<33?'moderate':'severe'; }
var BAND_COLOR = {minimal:'var(--b1)',mild:'var(--b2)',moderate:'var(--b3)',severe:'var(--b4)'};


function go(n){ state.step = n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){
  var s = L();
  document.title = (lang==='hi'?'मुफ़्त ड्राई आई Self-Check':'Free Dry Eye Self-Check')+' — Dr. Prateek Tiwari, Cornea Specialist';
  document.getElementById('foot').innerHTML = s.foot.map(function(p){return '<p>'+esc(p)+'</p>';}).join('') + '<p><a href="/policies.html#privacy">Privacy</a> · <a href="/policies.html#terms">Terms</a> · <a class="js-home" href="/?lang='+lang+'">LASIK Second Opinion</a></p>';

  if (state.urgent){ app.innerHTML = urgentHTML(); bindUrgent(); return; }
  var st = STEPS[state.step];
  var h = '';
  if (st.t==='intro'){
    h = '<section class="card fade"><p class="eyebrow">'+esc(s.eyebrow)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.intro)+'</p>'+
        '<div class="chips">'+s.chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('')+'</div>'+
        '<button class="btn btn-primary" id="startBtn" type="button">'+esc(s.start)+'</button></section>';
    app.innerHTML = h;
    document.getElementById('startBtn').onclick = function(){ track('dryeye_start'); go(1); };
    return;
  }
  if (st.t==='rf'){
    h = '<section class="card fade">'+progressHTML()+'<h2>'+esc(s.rfTitle)+'</h2><p class="hint">'+esc(s.rfSub)+'</p>'+
        '<ul class="rf">'+s.rf.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>'+
        '<div class="stack"><button class="btn btn-primary" id="rfNo" type="button">'+esc(s.rfNo)+'</button>'+
        '<button class="btn btn-line" id="rfYes" type="button">'+esc(s.rfYes)+'</button></div>'+
        '<div class="nav"><button class="btn btn-ghost" id="backBtn" type="button">← '+esc(s.back)+'</button><span></span></div></section>';
    app.innerHTML = h;
    document.getElementById('rfNo').onclick = function(){ go(2); };
    document.getElementById('rfYes').onclick = function(){ track('dryeye_redflag'); state.urgent = true; render(); window.scrollTo({top:0}); };
    document.getElementById('backBtn').onclick = function(){ go(0); };
    return;
  }
  if (st.t==='q'){
    var key = st.g+st.i, cur = state.ans[key];
    var text = s[st.g][st.i];
    var hint = s[st.g+'Hint'];
    var opts = s.freq.map(function(f,v){
      return '<button type="button" class="opt'+(cur===v?' sel':'')+'" data-v="'+v+'"><span class="dot"></span>'+esc(f)+'</button>';
    }).join('');
    if (st.g!=='sym') opts += '<button type="button" class="opt na'+(cur===null?' sel':'')+'" data-v="na"><span class="dot"></span>'+esc(s.na)+'</button>';
    h = '<section class="card fade">'+progressHTML()+'<p class="hint">'+esc(hint)+'</p><h2>'+esc(text)+'</h2><div style="height:14px"></div>'+
        '<div class="opts" role="radiogroup">'+opts+'</div>'+
        '<div class="nav"><button class="btn btn-ghost" id="backBtn" type="button">← '+esc(s.back)+'</button>'+
        (cur!==undefined?'<button class="btn btn-ghost" id="nextBtn" type="button">'+esc(s.next)+' →</button>':'<span></span>')+'</div></section>';
    app.innerHTML = h;
    app.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var v = b.dataset.v==='na'? null : +b.dataset.v;
        state.ans[key] = v;
        app.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        setTimeout(function(){ go(state.step+1); }, 220);
      };
    });
    document.getElementById('backBtn').onclick = function(){ go(state.step-1); };
    var nb = document.getElementById('nextBtn'); if (nb) nb.onclick = function(){ go(state.step+1); };
    return;
  }
  if (st.t==='age'){
    h = '<section class="card fade">'+progressHTML()+'<h2>'+esc(s.ageTitle)+'</h2><div style="height:14px"></div><div class="opts">'+
        s.ages.map(function(a,v){return '<button type="button" class="opt'+(state.age===v?' sel':'')+'" data-v="'+v+'"><span class="dot"></span>'+esc(a)+'</button>';}).join('')+
        '</div><div class="nav"><button class="btn btn-ghost" id="backBtn" type="button">← '+esc(s.back)+'</button>'+
        (state.age!==null?'<button class="btn btn-ghost" id="nextBtn" type="button">'+esc(s.next)+' →</button>':'<span></span>')+'</div></section>';
    app.innerHTML = h;
    app.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){ state.age = +b.dataset.v; app.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); setTimeout(function(){ go(state.step+1); },220); };
    });
    document.getElementById('backBtn').onclick = function(){ go(state.step-1); };
    var nb2 = document.getElementById('nextBtn'); if (nb2) nb2.onclick = function(){ go(state.step+1); };
    return;
  }
  if (st.t==='risk'){
    var any = RISK_KEYS.some(function(k){return state.risks[k];});
    var noneSel = state.risks.__none;
    h = '<section class="card fade">'+progressHTML()+'<h2>'+esc(s.riskTitle)+'</h2><p class="hint">'+esc(s.riskSub)+'</p><div class="opts">'+
        RISK_KEYS.map(function(k){return '<button type="button" class="opt'+(state.risks[k]?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(state.risks[k]?'true':'false')+'"><span class="box"></span>'+esc(s.risks[k][0])+'</button>';}).join('')+
        '<button type="button" class="opt na'+(noneSel?' sel':'')+'" data-k="__none"><span class="box"></span>'+esc(s.riskNone)+'</button></div>'+
        '<div style="height:18px"></div><button class="btn btn-primary" id="resBtn" type="button"'+((any||noneSel)?'':' disabled')+'>'+esc(s.seeResult)+'</button>'+
        '<div class="nav"><button class="btn btn-ghost" id="backBtn" type="button">← '+esc(s.back)+'</button><span></span></div></section>';
    app.innerHTML = h;
    app.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var k = b.dataset.k;
        if (k==='__none'){ state.risks = state.risks.__none? {} : {__none:true}; }
        else { delete state.risks.__none; state.risks[k] = !state.risks[k]; }
        render();
      };
    });
    document.getElementById('resBtn').onclick = function(){ go(state.step+1); };
    document.getElementById('backBtn').onclick = function(){ go(state.step-1); };
    return;
  }
  if (st.t==='result'){ app.innerHTML = resultHTML(); bindResult(); }
}

function urgentHTML(){
  var s = L();
  return '<section class="card urgent fade"><p class="eyebrow">'+esc(s.urgEyebrow)+'</p><h2>'+esc(s.urgTitle)+'</h2><p>'+esc(s.urgText)+'</p>'+
    '<div class="stack" style="margin-top:16px"><a class="btn btn-primary" href="'+MAPS_URL+'" target="_blank" rel="noopener">'+esc(s.urgWa)+'</a>'+
    '<p class="small" style="text-align:center;margin:4px 0 0">'+esc(s.urgCall)+'</p></div>'+
    '<div class="nav"><button class="btn btn-ghost" id="contBtn" type="button" style="text-align:left">'+esc(s.urgContinue)+'</button></div></section>';
}
function bindUrgent(){ document.getElementById('contBtn').onclick = function(){ state.urgent=false; go(2); }; }

function resultHTML(){
  var s = L(), sc = computeScore(), b = bandOf(sc), bd = s.bands[b];
  var pos = Math.min(98, Math.max(2, sc));
  var picked = RISK_KEYS.filter(function(k){return state.risks[k];});
  var showClinic = b!=='minimal' || picked.length>0;
  var h = '<section class="card fade"><p class="eyebrow">'+esc(s.resEyebrow)+'</p>'+
    '<div class="small">'+esc(s.scoreLabel)+'</div><div class="score"><b>'+sc+'</b><small>'+esc(s.scoreOf)+'</small></div>'+
    '<span class="band" style="background:'+BAND_COLOR[b]+'">'+esc(bd[0])+'</span>'+
    '<div class="gauge" aria-hidden="true"><div class="gbar"><span></span><span></span><span></span><span></span><i class="marker" style="left:'+pos+'%"></i></div>'+
    '<div class="glabels">'+[0,13,23,33,100].map(function(n){return '<span style="left:'+n+'%">'+n+'</span>';}).join('')+'</div></div>'+
    '<p style="margin-top:14px">'+esc(bd[1])+'</p>';
  if (picked.length){
    h += '<h3>'+esc(s.riskHead)+'</h3><ul class="list risk">'+picked.map(function(k){return '<li><b>'+esc(s.risks[k][0])+'</b> — <span>'+esc(s.risks[k][1])+'</span></li>';}).join('')+'</ul>';
  }
  h += '<div class="cta"><h3>'+esc(s.ctaHead)+'</h3><p class="small" style="color:var(--ink)">'+esc(s.ctaText)+'</p>'+
       '<div class="stack"><a class="btn btn-primary" id="ctaCheck" href="/check.html?lang='+lang+'">'+esc(s.ctaCheck)+'</a>'+
       '<a class="btn btn-line" id="ctaReview" href="'+FORM_URL+'">'+esc(s.ctaReview)+'</a></div>'+
       '<p class="small" style="margin:12px 0 0">'+esc(s.ctaOther)+'</p></div>';
  if (showClinic){
    h += '<h3>'+esc(s.clinicHead)+'</h3><ul class="list">'+s.clinic.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>';
  }
  h += '<h3>'+esc(s.tipsHead)+'</h3><ul class="list">'+s.tips.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>'+
       '<div class="stack" style="margin-top:22px"><button class="btn btn-line" id="copyBtn" type="button">'+esc(s.copy)+'</button>'+
       '<button class="btn btn-ghost" id="retakeBtn" type="button">↺ '+esc(s.retake)+'</button></div></section>';
  return h;
}
var tracked=false;
function bindResult(){
  var s = L(), sc = computeScore(), b = bandOf(sc);
  if (!tracked){ tracked=true; track('dryeye_complete',{band:b,score:sc}); try{ if(window.fbq) fbq('trackCustom','DryEyeCheckComplete',{band:b}); }catch(e){} }
  document.getElementById('ctaCheck').onclick=function(){ track('dryeye_to_lasik_check',{band:b}); };
  document.getElementById('ctaReview').onclick=function(){ track('generate_lead',{method:'dryeye_'+b}); try{ if(window.fbq) fbq('track','Lead'); }catch(e){} };
  document.getElementById('copyBtn').onclick = function(){
    var txt = s.copyText(sc, s.bands[b][0]);
    try {
      navigator.clipboard.writeText(txt).then(function(){ toast(s.copied); }, function(){});
    } catch(e){}
  };
  document.getElementById('retakeBtn').onclick = function(){ state = {step:0, ans:{}, age:null, risks:{}, urgent:false}; tracked=false; go(0); };
}
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1600); }

setLang(lang);
})();
</script>
</body>
</html>
